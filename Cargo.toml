[package]
name = "einntol"
version = "0.1.0"
edition = "2024"
authors = ["liavunn <liavunn@users.noreply.github.com>"]
description = "A universal toolkit"
license = "Apache-2.0"
repository = "https://github.com/liavunn/einntol"
keywords = ["cli", "utility", "rust"]
categories = ["command-line-utilities"]

[[bin]]
name = "EinnTol_Linux_x64_CLI"
path = "src/bin/run_cli.rs"

[[bin]]
name = "EinnTol_Linux_x64_GUI"
path = "src/bin/run_gui.rs"

[dependencies]
miette = "7.6"
fastrand = "2"
thiserror = "2"
wyhash = "0.6"
sysinfo = "0.39"
ignore = "0.4"
bitflags = "2"
iced = { version = "0.14", optional = true }
tokio = { version = "1.52", features = ["full"]}
mmap = "0.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "sqlite", "macros", "derive"] }

[features]
cli = []
gui = ["iced"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
