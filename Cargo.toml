[package]
name = "einntol"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = "2"
wyhash = "0.6"
miette = {version = 7, features = ["fancy"]}
tauri = "2"
sysinfo = "0.38"
once_cell = "1"
tracing = {version = "0.1", optional = true}
tracing-appender = {version = "0.2", optional = true}
ignore = "0.4"
bitflags = "2"
crossbeam-channel = "0.5"

[features]
default = ["logging"]
logging = ["dep:tracing", "dep:tracing-appender"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
